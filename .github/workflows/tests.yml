name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # Never cancel a main run; PR runs cancel superseded ones.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Docs-only change: skip the slow steps but still report success (the check is required).
      - name: Detect docs-only change
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          docs_only=false
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
            if [ -n "$files" ]; then
              docs_only=true
              while IFS= read -r f; do
                case "$f" in
                  docs/*|agent-handoffs/*|.claude/skills/*) ;;
                  src/*|tests/*) docs_only=false ;;
                  *.md) ;;
                  *) docs_only=false ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.docs_only != 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        if: steps.scope.outputs.docs_only != 'true'
        run: pip install -e ".[dev]"
      - name: Ruff
        if: steps.scope.outputs.docs_only != 'true'
        run: ruff check .
      - name: Unit tests (generation mocked; blender and gpu markers skipped)
        if: steps.scope.outputs.docs_only != 'true'
        run: python -m pytest -q
